<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#101d32"><title>Mercadinho do Ana</title>
<style>
:root{--navy:#101d32;--blue:#2457d6;--cyan:#38c5d8;--bg:#eef2f7;--ink:#182438;--muted:#68768b;--green:#16875b;--red:#c73e48;--line:#dce3ec}*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:Arial,Helvetica,sans-serif;color:var(--ink);font-size:16px}.top{background:var(--navy);color:white;padding:17px 18px 20px;display:flex;align-items:center;justify-content:space-between}.brand{font-weight:800;font-size:19px;letter-spacing:.2px}.brand small{display:block;font-size:11px;font-weight:500;color:#b7c5d9;margin-top:4px;letter-spacing:1px}.pill{font-size:11px;background:#263b58;padding:7px 10px;border-radius:20px;color:#dce8fa}.wrap{max-width:760px;margin:auto;padding:14px}.totalbox{background:white;border:1px solid var(--line);border-radius:17px;padding:15px 17px;display:flex;align-items:center;justify-content:space-between;box-shadow:0 3px 12px #152b4610;margin-bottom:14px}.totalbox span{font-size:13px;color:var(--muted)}.total{font-size:27px;font-weight:800;color:var(--navy);margin-top:4px}.smallbtn{border:1px solid var(--line);background:white;color:var(--blue);padding:10px 12px;border-radius:10px;font-weight:700}.sectionhead{display:flex;align-items:center;justify-content:space-between;margin:16px 2px 10px}.sectionhead h2{font-size:16px;margin:0}.products{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.product{background:white;border:1px solid var(--line);border-radius:15px;padding:12px;min-height:128px;display:flex;flex-direction:column;justify-content:space-between;box-shadow:0 2px 8px #10223a08}.prodtop{display:flex;align-items:center;gap:10px}.emoji{font-size:29px;background:#f0f4fa;width:48px;height:48px;border-radius:12px;display:grid;place-items:center}.pname{font-weight:700;font-size:14px}.price{font-size:14px;color:var(--muted);margin-top:4px}.add{border:0;background:var(--blue);color:white;border-radius:10px;padding:10px;font-weight:800;font-size:14px;width:100%;margin-top:10px}.cart{background:white;border:1px solid var(--line);border-radius:15px;padding:13px;margin-top:14px}.empty{color:var(--muted);font-size:14px;padding:8px 2px}.cartrow{display:flex;align-items:center;justify-content:space-between;padding:9px 0;border-bottom:1px solid #edf0f4;gap:8px}.cartrow:last-child{border:0}.cartname{font-size:14px;font-weight:700}.cartmeta{font-size:12px;color:var(--muted);margin-top:3px}.qty{display:flex;align-items:center;gap:9px}.qty button{width:31px;height:31px;border:1px solid var(--line);background:#f7f9fc;border-radius:9px;font-size:18px;font-weight:700;color:var(--blue)}.paymain{width:100%;border:0;background:var(--green);color:white;border-radius:14px;padding:17px;font-size:17px;font-weight:800;margin:14px 0 5px;box-shadow:0 5px 12px #16875b30}.paymain:disabled{opacity:.45;box-shadow:none}.hint{text-align:center;color:var(--muted);font-size:12px;margin:7px 0 16px}.overlay{position:fixed;inset:0;background:#081426b8;display:none;align-items:flex-end;justify-content:center;z-index:5;padding:10px}.overlay.show{display:flex}.sheet{width:min(100%,540px);background:white;border-radius:22px;padding:22px 18px 24px;max-height:94vh;overflow:auto;text-align:center}.sheet h2{margin:5px 0 8px;font-size:22px}.sheet p{color:var(--muted);line-height:1.45;margin:7px 0 17px}.amount{font-size:30px;font-weight:900;color:var(--navy);margin:13px 0 18px}.actions{display:grid;gap:9px}.action{border:0;border-radius:13px;padding:15px;font-weight:800;font-size:16px;background:var(--blue);color:white}.action.secondary{background:#edf2fa;color:var(--navy)}.action.green{background:var(--green)}.methodgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.method{border:1px solid var(--line);background:white;border-radius:15px;padding:18px 8px;font-weight:800;font-size:15px}.method b{display:block;font-size:29px;margin-bottom:8px}.method-label{display:block;font-size:16px;font-weight:900;letter-spacing:.3px;color:var(--navy);margin-top:5px}.method.pix .method-label{font-size:20px;color:#16875b}.terminal{background:#101d32;color:#c6f6dc;border-radius:18px;padding:20px 12px;margin:18px auto;max-width:300px;box-shadow:inset 0 0 0 5px #253752}.terminal .screenlabel{font-size:12px;letter-spacing:2px;color:#9cb0ca}.terminal .screenamount{font-size:27px;font-weight:800;margin:12px}.tap{font-size:45px;margin:12px}.fakeqr{width:150px;height:150px;margin:15px auto;background:white;padding:8px;border:1px solid #ddd;border-radius:8px}.fakeqr canvas{width:100%;height:100%}.success{font-size:60px;color:var(--green);margin:6px}.successmsg{font-size:25px;font-weight:900;color:var(--green)}.field{text-align:left;margin:10px 0}.field label{display:block;font-size:13px;font-weight:700;margin-bottom:6px}.field input,.field select{width:100%;padding:13px;border:1px solid var(--line);border-radius:10px;font-size:16px}.foot{font-size:11px;color:#8190a3;text-align:center;padding:12px 0 20px}.danger{background:#fff0f0;color:var(--red)}.sectors{display:flex;gap:8px;overflow-x:auto;padding:2px 0 12px;scrollbar-width:thin}.sector{white-space:nowrap;border:1px solid var(--line);background:#fff;color:var(--navy);padding:9px 13px;border-radius:22px;font-weight:700;font-size:13px}.sector.active{background:var(--navy);border-color:var(--navy);color:#fff}.productsector{font-size:10px;color:var(--muted);margin-top:3px;text-transform:uppercase;letter-spacing:.5px}.noresults{grid-column:1/-1;background:#fff;border:1px dashed var(--line);border-radius:14px;padding:22px;text-align:center;color:var(--muted)}.emoji-preview{font-size:28px;min-width:42px;text-align:center}
@media(min-width:600px){.products{grid-template-columns:repeat(3,minmax(0,1fr))}.overlay{align-items:center}}
</style></head><body>
<header class="top"><div class="brand">◉ MERCADINHO DO ANA <small>SIMULADOR DE COMPRAS</small></div><span class="pill">MODO EDUCATIVO</span></header>
<main class="wrap">
 <section class="totalbox"><div><span>TOTAL DA COMPRA</span><div class="total" id="total">R$ 0,00</div></div><div style="display:flex;gap:7px"><button class="smallbtn" onclick="openHistory()">📋 Histórico</button><button class="smallbtn" onclick="openAdmin()">⚙ Produtos</button></div></section>
 <div class="sectionhead"><h2>Produtos disponíveis</h2><span style="font-size:12px;color:var(--muted)">Toque para adicionar</span></div>
 <div class="field" style="margin:0 0 10px"><input id="searchproduct" type="search" placeholder="🔎 Pesquisar produto..." oninput="searchProducts(this.value)" aria-label="Pesquisar produto"></div>
 <nav class="sectors" id="sectors" aria-label="Setores do mercado"></nav>
 <section class="products" id="products"></section>
 <section class="cart"><div class="sectionhead" style="margin:0 0 7px"><h2>🛒 Sua compra</h2><button class="smallbtn" onclick="clearCart()">Limpar</button></div><div id="cartitems" class="empty">Nenhum produto adicionado ainda.</div></section>
 <button class="paymain" id="paybutton" disabled onclick="openPayment()">IR PARA PAGAMENTO　→</button><div class="hint">Escolha os produtos e confira o valor antes de pagar.</div>
 <div class="foot">Simulação educativa • Não realiza cobranças reais</div>
</main>
<div class="overlay" id="overlay" onclick="if(event.target===this)closeModal()"><div class="sheet" id="sheet"></div></div>
<script>
const defaults=[['Pão francês','🥖',0.80,'Padaria'],['Leite','🥛',5.49,'Laticínios'],['Arroz 1 kg','🍚',6.99,'Mercearia'],['Feijão','🫘',7.50,'Mercearia'],['Banana','🍌',3.99,'Hortifruti'],['Maçã','🍎',2.50,'Hortifruti'],['Suco','🧃',4.50,'Bebidas'],['Biscoito','🍪',3.25,'Mercearia'],['Ovos','🥚',12.00,'Laticínios'],['Sabonete','🧼',2.99,'Higiene'],['Macarrão','🍝',4.79,'Mercearia'],['Água','💧',2.00,'Bebidas']];
const sectorNames=['Todos','Hortifruti','Padaria','Mercearia','Bebidas','Laticínios','Higiene','Outros'];let products=JSON.parse(localStorage.getItem('me_products')||'null')||defaults.map((p,i)=>({id:i+1,name:p[0],emoji:p[1],price:p[2],category:p[3]}));products=products.map(p=>({...p,category:p.category||guessCategory(p.name)}));let activeSector='Todos',searchTerm='';let cart={};let mode='';let cashValue='';let history=JSON.parse(localStorage.getItem('me_history')||'[]');
const money=n=>n.toLocaleString('pt-BR',{style:'currency',currency:'BRL'});const total=()=>Object.entries(cart).reduce((s,[id,q])=>s+(products.find(p=>p.id==id)?.price||0)*q,0);
function save(){localStorage.setItem('me_products',JSON.stringify(products))}
function render(){
 const nav=document.getElementById('sectors');nav.innerHTML=sectorNames.map(c=>`<button class="sector ${activeSector===c?'active':''}" onclick="selectSector('${c}')">${c==='Todos'?'Todos os produtos':c}</button>`).join('');
 const term=searchTerm.trim().toLocaleLowerCase('pt-BR');
 const visible=products.filter(p=>(activeSector==='Todos'||p.category===activeSector)&&(!term||p.name.toLocaleLowerCase('pt-BR').includes(term)));
 document.getElementById('products').innerHTML=visible.length?visible.map(p=>`<article class="product"><div class="prodtop"><div class="emoji">${esc(p.emoji||'🛍️')}</div><div><div class="pname">${esc(p.name)}</div><div class="price">${money(p.price)}</div><div class="productsector">${esc(p.category||'Outros')}</div></div></div><button class="add" onclick="add(${p.id})">＋ ADICIONAR</button></article>`).join(''):'<div class="noresults">Nenhum produto encontrado.<br>Experimente outra pesquisa ou setor.</div>';
 let entries=Object.entries(cart).filter(([id,q])=>q>0);document.getElementById('cartitems').className=entries.length?'':'empty';document.getElementById('cartitems').innerHTML=entries.length?entries.map(([id,q])=>{let p=products.find(x=>x.id==id);return p?`<div class="cartrow"><div><div class="cartname">${esc(p.emoji||'🛍️')} ${esc(p.name)}</div><div class="cartmeta">${money(p.price)} cada • ${money(p.price*q)}</div></div><div class="qty"><button onclick="change(${id},-1)" aria-label="Diminuir">−</button><b>${q}</b><button onclick="change(${id},1)" aria-label="Aumentar">+</button></div></div>`:''}).join(''):'Nenhum produto adicionado ainda.';document.getElementById('total').textContent=money(total());document.getElementById('paybutton').disabled=total()<=0
}
function selectSector(name){activeSector=name;render()}
function searchProducts(value){searchTerm=value;const y=document.getElementById('sectors').scrollLeft;render();document.getElementById('sectors').scrollLeft=y;document.getElementById('searchproduct').value=value}
function guessCategory(name){let n=String(name||'').toLocaleLowerCase('pt-BR');if(/pão|bolo|rosca|biscoito de padaria/.test(n))return 'Padaria';if(/banana|maçã|maca|fruta|verdura|legume|tomate|cenoura|alface|batata/.test(n))return 'Hortifruti';if(/leite|queijo|iogurte|manteiga|ovo/.test(n))return 'Laticínios';if(/água|agua|suco|refrigerante|refri/.test(n))return 'Bebidas';if(/sabonete|shampoo|creme dental|pasta de dente|detergente|sabão|sabonete/.test(n))return 'Higiene';if(/arroz|feijão|feijao|macarrão|macarrao|farinha|açúcar|acucar|óleo|oleo|biscoito|café|cafe/.test(n))return 'Mercearia';return 'Outros'}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function add(id){cart[id]=(cart[id]||0)+1;render();beep(650,.045)}function change(id,n){cart[id]=(cart[id]||0)+n;if(cart[id]<=0)delete cart[id];render()}function clearCart(){cart={};render()}
function show(html){document.getElementById('sheet').innerHTML=html;document.getElementById('overlay').classList.add('show')}function closeModal(){document.getElementById('overlay').classList.remove('show')}function openPayment(){if(!total())return;show(`<h2>Como deseja pagar?</h2><p>Escolha a forma de pagamento.</p><div class="amount">${money(total())}</div><div class="methodgrid"><button class="method" onclick="cardStart()"><b>💳</b><span class="method-label">CARTÃO</span></button><button class="method pix" onclick="pixStart()"><span class="method-label">PIX</span></button><button class="method" onclick="cashStart()" style="grid-column:1/-1"><b>💵</b><span class="method-label">DINHEIRO</span></button></div><button class="action secondary" style="width:100%;margin-top:12px" onclick="closeModal()">VOLTAR</button>`)}
function cardStart(){mode='cartão';speak('Escolha como deseja usar o cartão');show(`<h2>Pagamento com cartão</h2><p>Escolha como deseja simular o uso do cartão.</p><div class="amount">${money(total())}</div><div class="actions"><button class="action" onclick="cardTap()">💳 APROXIMAR O CARTÃO</button><button class="action" onclick="cardPin()">🔢 DIGITAR SENHA</button><button class="action secondary" onclick="openPayment()">VOLTAR</button></div>`)}
function cardTap(){speak('Aproxime ou insira o cartão');show(`<h2>Pagamento com cartão</h2><p>Aproxime ou insira o cartão na maquininha.</p><div class="terminal"><div class="screenlabel">VALOR DA COMPRA</div><div class="screenamount">${money(total())}</div><div class="tap">▰</div><div>APROXIME O CARTÃO</div></div><div class="actions"><button class="action green" onclick="processing()">✓ CONFIRMAR CARTÃO</button><button class="action secondary" onclick="cardStart()">VOLTAR</button></div>`)}
function cardPin(){speak('Digite uma senha qualquer para continuar');show(`<h2>Digite a senha</h2><p>Na atividade, o aluno pode inventar uma senha de 4 números.</p><div class="terminal"><div class="screenlabel">VALOR DA COMPRA</div><div class="screenamount">${money(total())}</div><div class="field"><label style="color:#fff">Senha fictícia</label><input id="cardpin" type="password" inputmode="numeric" maxlength="4" placeholder="••••" style="text-align:center;letter-spacing:12px;font-size:24px"></div></div><div class="actions"><button class="action green" onclick="confirmPin()">✓ CONFIRMAR SENHA</button><button class="action secondary" onclick="cardStart()">VOLTAR</button></div>`)}
function confirmPin(){let pin=document.getElementById('cardpin').value;if(!/^\d{4}$/.test(pin)){speak('Digite quatro números para a senha');return}processing()}
function pixStart(){mode='pix';speak('Faça de conta que está lendo o código Pix');show(`<h2>Pagamento com Pix</h2><p>Leia o código ilustrativo ou toque no botão para simular o pagamento.</p><div class="amount">${money(total())}</div><div class="fakeqr"><canvas id="qr" width="132" height="132"></canvas></div><div style="font-size:11px;color:#8994a4">QR CODE FICTÍCIO — NÃO PAGÁVEL</div><div class="actions" style="margin-top:15px"><button class="action green" onclick="processing()">✓ JÁ FIZ O PIX</button><button class="action secondary" onclick="openPayment()">VOLTAR</button></div>`);drawFakeQR()}
function drawFakeQR(){let c=document.getElementById('qr');if(!c)return;let x=c.getContext('2d'),n=29,cell=132/n;x.fillStyle='#fff';x.fillRect(0,0,132,132);let seed=2026;function rnd(){seed=(seed*9301+49297)%233280;return seed/233280}for(let y=0;y<n;y++)for(let xx=0;xx<n;xx++){let finder=(xx<7&&y<7)||(xx>=n-7&&y<7)||(xx<7&&y>=n-7);let black=finder?((xx% (n-7)<2||y%(n-7)<2)||((xx% (n-7)>=2&&xx%(n-7)<=4)&&(y%(n-7)>=2&&y%(n-7)<=4))):rnd()>.5;if(black){x.fillStyle='#101820';x.fillRect(Math.floor(xx*cell),Math.floor(y*cell),Math.ceil(cell),Math.ceil(cell))}}}
function cashStart(){mode='dinheiro';cashValue='';show(`<h2>Pagamento em dinheiro</h2><p>Quanto o cliente entregou?</p><div class="amount">Total: ${money(total())}</div><div class="field"><label>Valor recebido (R$)</label><input id="cash" type="number" min="0" step="0.01" inputmode="decimal" placeholder="Ex.: 20,00" oninput="cashValue=this.value"></div><div id="changeinfo" style="font-weight:800;margin:10px 0;color:var(--green)"></div><div class="actions"><button class="action green" onclick="finishCash()">CONFIRMAR PAGAMENTO</button><button class="action secondary" onclick="openPayment()">VOLTAR</button></div>`);document.getElementById('cash').addEventListener('input',e=>{cashValue=e.target.value;let v=Number(cashValue);document.getElementById('changeinfo').textContent=v>=total()?'Troco: '+money(v-total()):'Faltam: '+money(total()-v)})}
function finishCash(){let v=Number(cashValue);if(!cashValue||v<total()){speak('O valor recebido é menor que o total da compra');return}processing()}
function processing(){show(`<div style="font-size:48px;margin:10px">⏳</div><h2>Processando...</h2><p>Aguarde só um pouquinho.</p><div class="terminal"><div class="screenlabel">MAQUININHA ESCOLAR</div><div class="screenamount">${money(total())}</div><div style="padding:12px">PROCESSANDO</div></div>`);speak('Processando pagamento');setTimeout(()=>approved(),1700)}
function approved(){let amount=total();let items=Object.entries(cart).map(([id,q])=>{let p=products.find(x=>x.id==id);return p?{name:p.name,emoji:p.emoji||'🛍️',category:p.category||'Outros',price:p.price,quantity:q}:null}).filter(Boolean);let received=mode==='dinheiro'?Number(cashValue):null;let record={id:Date.now(),date:new Date().toISOString(),amount,method:mode,items,received,change:received===null?null:received-amount};history.unshift(record);localStorage.setItem('me_history',JSON.stringify(history));beep(880,.12);setTimeout(()=>beep(1175,.22),140);speak('Pagamento aprovado! Muito bem!');show(`<div class="success">✓</div><div class="successmsg">PAGAMENTO APROVADO!</div><p>Compra concluída com sucesso.</p><div class="amount">${money(amount)}</div><div style="background:#f2f6fa;border-radius:12px;padding:13px;margin:15px 0;text-align:left;font-size:14px"><b>Resumo da compra</b><div style="margin-top:8px">${Object.entries(cart).map(([id,q])=>{let p=products.find(x=>x.id==id);return p?`${esc(p.name)} × ${q} — ${money(p.price*q)}`:''}).join('<br>')}</div><hr style="border:0;border-top:1px solid #dce3ec"><b>Total: ${money(amount)}</b></div><button class="action green" style="width:100%" onclick="newSale()">NOVA COMPRA</button>`)}
function openHistory(){let rows=history.length?history.map(h=>`<div class="cartrow" style="display:block"><div style="display:flex;justify-content:space-between;gap:8px"><b>${new Date(h.date).toLocaleString('pt-BR')}</b><b>${money(h.amount)}</b></div><div class="cartmeta">Pagamento: ${esc(h.method.toUpperCase())}</div><div style="font-size:13px;margin-top:8px"><b>Produtos comprados:</b>${h.items.map(i=>`<div style="display:flex;justify-content:space-between;gap:8px;margin-top:5px"><span>${esc(i.emoji||'🛍️')} ${esc(i.name)} × ${i.quantity}</span><b>${money(i.price*i.quantity)}</b></div>`).join('')}</div>${h.method==='dinheiro'?`<div class="cartmeta">Recebido: ${money(h.received)} • Troco: ${money(h.change)}</div>`:''}</div>`).join(''):'<div class="empty">Ainda não há compras registradas.</div>';show(`<h2>Histórico de compras</h2><p>As compras concluídas ficam salvas neste aparelho.</p><div style="text-align:left;max-height:52vh;overflow:auto">${rows}</div><div class="actions" style="margin-top:14px"><button class="action secondary" onclick="closeModal()">FECHAR</button>${history.length?'<button class="action danger" onclick="clearHistory()">APAGAR HISTÓRICO</button>':''}</div>`)}
function clearHistory(){if(!confirm('Deseja apagar todo o histórico de compras?'))return;history=[];localStorage.setItem('me_history','[]');openHistory()}
function newSale(){cart={};render();closeModal();speak('Vamos fazer uma nova compra')}
function beep(freq,duration){try{let ctx=new(window.AudioContext||window.webkitAudioContext)(),o=ctx.createOscillator(),g=ctx.createGain();o.connect(g);g.connect(ctx.destination);o.frequency.value=freq;o.type='sine';g.gain.setValueAtTime(.001,ctx.currentTime);g.gain.exponentialRampToValueAtTime(.13,ctx.currentTime+.015);g.gain.exponentialRampToValueAtTime(.001,ctx.currentTime+duration);o.start();o.stop(ctx.currentTime+duration+.03);o.onended=()=>ctx.close()}catch(e){}}
function speak(t){if(!('speechSynthesis'in window))return;window.speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(t);u.lang='pt-BR';u.rate=.9;window.speechSynthesis.speak(u)}
function openAdmin(){show(`<h2>Gerenciar produtos</h2><p>Adicione produtos ou altere os que já existem.</p><div class="field"><label>Nome do produto</label><input id="newname" placeholder="Ex.: Cenoura"></div><div class="field"><label>Emoji do produto</label><div style="display:flex;align-items:center;gap:10px"><div class="emoji-preview" id="emojipreview">🛍️</div><input id="newemoji" placeholder="Ex.: 🥕" oninput="previewEmoji(this.value)" autocomplete="off" style="flex:1"></div><div class="cartmeta">Digite ou cole um emoji. Se deixar vazio, será usado 🛍️.</div></div><div class="field"><label>Setor</label><select id="newcategory">${sectorNames.filter(c=>c!=='Todos').map(c=>`<option value="${c}">${c}</option>`).join('')}</select></div><div class="field"><label>Preço (R$)</label><input id="newprice" type="number" min="0.01" step="0.01" placeholder="Ex.: 3,50"></div><button class="action green" style="width:100%" onclick="addProduct()">＋ ADICIONAR PRODUTO</button><div style="text-align:left;margin-top:18px;font-weight:800">Produtos cadastrados</div><div style="max-height:180px;overflow:auto;text-align:left">${products.map(p=>`<div class="cartrow"><span>${esc(p.emoji||'🛍️')} ${esc(p.name)} <small style="color:var(--muted)">(${esc(p.category||'Outros')})</small> — ${money(p.price)}</span><button class="smallbtn danger" onclick="removeProduct(${p.id})">Excluir</button></div>`).join('')}</div><button class="action secondary" style="width:100%;margin-top:12px" onclick="closeModal()">FECHAR</button>`)}
function previewEmoji(value){document.getElementById('emojipreview').textContent=value.trim()||'🛍️'}
function addProduct(){let name=document.getElementById('newname').value.trim(),emoji=document.getElementById('newemoji').value.trim()||'🛍️',price=Number(document.getElementById('newprice').value),category=document.getElementById('newcategory').value;if(!name||!price||price<=0){speak('Preencha o nome e um preço válido');return}products.push({id:Date.now(),name,emoji,price,category});save();render();openAdmin();speak('Produto adicionado')}
function removeProduct(id){products=products.filter(p=>p.id!==id);delete cart[id];save();render();openAdmin()}
render();
</script></body></html>
